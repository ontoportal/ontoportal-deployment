name: keda-k3s-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keda-k3s-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keda:
    name: OntoPortal KEDA smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install pyyaml
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Install local k3s test runner
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
          k3d version
          kubectl version --client=true
          helm version
      - name: Create disposable k3s cluster
        run: |
          k3d cluster create ontoportal-keda-live \
            --agents 0 \
            --timeout 300s \
            --wait \
            --k3s-arg '--kubelet-arg=feature-gates=KubeletInUserNamespace=true@server:*'
          kubectl get nodes -o wide
          kubectl get storageclass
      - name: Install KEDA operator
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          kubectl create namespace keda
          helm upgrade --install keda kedacore/keda \
            --namespace keda \
            --version 2.20.1 \
            -f values/addons/keda-operator.yaml \
            --timeout 10m
          kubectl -n keda rollout status deploy/keda-operator --timeout=10m
          kubectl -n keda rollout status deploy/keda-operator-metrics-apiserver --timeout=10m
          kubectl -n keda rollout status deploy/keda-admission-webhooks --timeout=10m
      - name: Create namespace and existing Secret
        run: |
          kubectl create namespace ontoportal
          kubectl -n ontoportal create secret generic ontoportal-secrets \
            --from-literal=apiKey="$(openssl rand -base64 36)" \
            --from-literal=adminPassword="$(openssl rand -base64 24)" \
            --from-literal=mysqlRootPassword="$(openssl rand -base64 24)" \
            --from-literal=storeDbaPassword="$(openssl rand -base64 24)" \
            --from-literal=storeDavPassword="$(openssl rand -base64 24)"
      - name: Install clean OntoPortal with KEDA overlay
        run: |
          helm upgrade --install ontoportal chart/ontoportal \
            --namespace ontoportal \
            -f values/profiles/ontoportal-clean.yaml \
            -f values/profiles/k3s-local.yaml \
            -f values/profiles/k3s-ci.yaml \
            -f values/addons/keda-autoscaling.yaml \
            --set global.createNamespace=false \
            --set secrets.create=false \
            --set secrets.existingSecret=ontoportal-secrets \
            --timeout 25m
      - name: Wait for rollout
        run: |
          for deploy in $(kubectl -n ontoportal get deploy -o name); do
            kubectl -n ontoportal rollout status "$deploy" --timeout=20m
          done
          kubectl -n ontoportal get pods,pvc,svc,scaledobject,hpa -o wide
      - name: Run deep smoke test
        env:
          SMOKE_DEEP: "true"
          FAIL_ON_RESTARTS: "true"
          MAX_RESTARTS: "3"
          ROLLOUT_TIMEOUT: "15m"
        run: ./scripts/smoke.sh ontoportal ontoportal
      - name: Validate KEDA resources
        run: ./scripts/keda-check.sh ontoportal ontoportal "api ui"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n keda get all -o wide || true
          kubectl -n keda logs deploy/keda-operator --all-containers --tail=200 || true
          kubectl -n keda logs deploy/keda-operator-metrics-apiserver --all-containers --tail=200 || true
          kubectl -n ontoportal get all,pvc,scaledobject,hpa,events -o wide || true
          kubectl -n ontoportal describe scaledobject || true
          kubectl -n ontoportal describe hpa || true
          kubectl -n ontoportal describe pods || true
          for component in api ui cron store solr-term solr-prop redis-persistent mgrep mysql cache; do
            echo "===== logs: ${component} ====="
            kubectl -n ontoportal logs deploy/ontoportal-${component} --all-containers --tail=200 || true
          done
          docker ps -a || true
          docker logs k3d-ontoportal-keda-live-server-0 --tail=200 || true
      - name: Delete disposable k3s cluster
        if: always()
        run: k3d cluster delete ontoportal-keda-live || true
