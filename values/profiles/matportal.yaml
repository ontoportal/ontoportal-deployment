profile:
  name: matportal
  matportal: true
  description: "MatPortal profile: MatPortal images/branding, optional FAIR/Matomo/assistant hooks, and explicitly gated runtime patches."

global:
  namespace: matportal

images:
  api:
    repository: agroportal/ontologies_api
    tag: master
  cron:
    repository: agroportal/ontologies_api
    tag: master
  ui:
    repository: ghcr.io/matportal/bioportal_web_ui
    tag: master
  mgrep:
    repository: ontoportal/mgrep-ncbo
    tag: "0.1"

api:
  publicUrl: https://data.matportal.org
  restUrlPrefix: https://data.matportal.org
  enableSlices: "true"

ui:
  siteName: MatPortal
  orgName: MatPortal
  orgUrl: https://matportal.org
  uiTheme: matportal
  uiUrl: https://matportal.org
  publicApiUrl: https://data.matportal.org
  supportEmail: matolab.mail@gmail.com
  fairnessDisabled: "false"
  useLegacyBiomixer: "false"
  publicSparqlUrl: https://matportal.org/sparql_proxy
  extraEnv:
    MATPORTAL_LIVE_SUMMARY_METRICS_ENABLED: "false"

redis:
  mode: shared
solr:
  mode: single
mgrep:
  service:
    port: 55555
  containerPort: 55555
  dictionaryPath: /data/mgrep/dictionary.txt

store:
  engine: virtuoso
  kbName: ontologies_api

fairness:
  enabled: true
  publicUrl: https://matportal.org/fairness-assessment/

matomo:
  enabled: false
  siteId: "1"
  url: ""

assistant:
  enabled: false
ontopanel:
  enabled: false

patches:
  matportalApiParentNormalization:
    enabled: true
  runtimeHotfixes:
    enabled: false
