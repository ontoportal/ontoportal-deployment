name: agroportal-clean
services:
  redis:
    image: redis:7
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - ${DATA_DIR:-./data}/redis:/data
  solr-configsets:
    image: agroportal/ncbo_cron:development
    restart: 'no'
    volumes:
    - ${DATA_DIR:-./data}/solr/configsets:/opt/solr-configsets
    command:
    - bash
    - -lc
    - 'set -euo pipefail

      if [ -d /srv/ontoportal/ontologies_api ]; then cd /srv/ontoportal/ontologies_api;
      elif [ -d /srv/ontoportal/ncbo_cron ]; then cd /srv/ontoportal/ncbo_cron; fi

      gem_dir=$$(ruby -e ''require "bundler/setup"; %w[ontologies_linked_data ncbo_annotator
      ncbo_ontology_recommender].each { |g| p = Gem::Specification.find_by_name(g).full_gem_path
      rescue nil; if p && Dir.exist?("#{p}/config/solr"); print p; break; end }''
      2>/dev/null || true)

      default_conf=$$(ruby -e ''require "bundler/setup"; %w[ontologies_linked_data
      ncbo_annotator ncbo_cron ontologies_api].each { |g| p = Gem::Specification.find_by_name(g).full_gem_path
      rescue nil; if p && Dir.exist?("#{p}/test/solr/configsets/_default/conf"); print
      "#{p}/test/solr/configsets/_default/conf"; break; end }'' 2>/dev/null || true)

      if [ -z "$$gem_dir" ] || [ -z "$$default_conf" ]; then echo "ERROR: Solr configsets
      not found" >&2; exit 1; fi

      src="$$gem_dir/config/solr"

      mkdir -p /opt/solr-configsets

      rm -rf /opt/solr-configsets/term_search /opt/solr-configsets/property_search
      /opt/solr-configsets/_default

      mkdir -p /opt/solr-configsets/term_search/conf /opt/solr-configsets/property_search/conf
      /opt/solr-configsets/_default/conf

      cp -a "$$default_conf/." /opt/solr-configsets/_default/conf/

      cp -a "$$default_conf/." /opt/solr-configsets/term_search/conf/

      cp -a "$$default_conf/." /opt/solr-configsets/property_search/conf/

      cp -a "$$src/term_search/." /opt/solr-configsets/term_search/conf/

      cp -a "$$src/property_search/." /opt/solr-configsets/property_search/conf/

      for schema_file in /opt/solr-configsets/term_search/conf/schema.xml /opt/solr-configsets/property_search/conf/schema.xml;
      do if [ -f "$$schema_file" ] && ! grep -q ''name="resource_model"'' "$$schema_file";
      then sed -i ''/name="resource_id"/a \    <field name="resource_model" type="string"
      indexed="true" stored="true" multiValued="false" />'' "$$schema_file"; fi; done'
  solr:
    image: solr:9.1
    restart: unless-stopped
    environment:
      SOLR_HEAP: ${SOLR_HEAP:-1g}
    depends_on:
      solr-configsets:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD-SHELL
      - solr status >/dev/null 2>&1 || /opt/solr/bin/solr status >/dev/null 2>&1
      interval: 20s
      timeout: 5s
      retries: 30
    ports:
    - 127.0.0.1:${SOLR_PORT:-8983}:8983
    volumes:
    - ${DATA_DIR:-./data}/solr:/var/solr
    - ${DATA_DIR:-./data}/solr/configsets:/opt/solr-configsets:ro
    command:
    - bash
    - -lc
    - 'set -euo pipefail

      mkdir -p /var/solr/data/configsets/_default

      if [ -d /opt/solr-configsets/_default ]; then cp -a /opt/solr-configsets/_default/.
      /var/solr/data/configsets/_default/; elif [ -d /opt/solr/server/solr/configsets/_default
      ]; then cp -a /opt/solr/server/solr/configsets/_default/. /var/solr/data/configsets/_default/;
      fi

      solr start -p 8983

      for core_cfg in term_search_core1:/opt/solr-configsets/term_search prop_search_core1:/opt/solr-configsets/property_search;
      do core="$${core_cfg%%:*}"; cfg="$${core_cfg#*:}"; if [ -d "$$cfg" ]; then solr
      create_core -c "$$core" -d "$$cfg" || true; else solr create_core -c "$$core"
      || true; fi; done

      solr stop -p 8983

      exec solr start -f -p 8983'
  virtuoso:
    image: tenforce/virtuoso:virtuoso7.2.5
    restart: unless-stopped
    ports:
    - 127.0.0.1:${VIRTUOSO_PORT:-8890}:8890
    environment:
      DBA_PASSWORD: ${STORE_DBA_PASSWORD:-change-me}
    volumes:
    - ${DATA_DIR:-./data}/virtuoso:/data
  mgrep:
    image: ontoportal/mgrep-ncbo:0.1
    restart: unless-stopped
    ports:
    - 127.0.0.1:${MGREP_PORT:-55556}:55556
    volumes:
    - ${DATA_DIR:-./data}:/data
    command: mkdir -p $(dirname /data/mgrep/dictionary.txt); [ -s /data/mgrep/dictionary.txt
      ] || (cp /srv/mgrep/dictionary/dictionary.txt /data/mgrep/dictionary.txt 2>/dev/null
      || printf '0\tDUMMY\n' > /data/mgrep/dictionary.txt); mgrep --port 55556 -f
      /data/mgrep/dictionary.txt -w /srv/mgrep/word_divider.txt -c /srv/mgrep/CaseFolding.txt
      && tail -f /dev/null
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bioportal_ui_production
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    ports:
    - 127.0.0.1:${MYSQL_PORT:-3306}:3306
    volumes:
    - ${DATA_DIR:-./data}/mysql:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -p$${MYSQL_ROOT_PASSWORD:-change-me} --silent
      interval: 20s
      timeout: 5s
      retries: 30
  memcached:
    image: memcached:latest
    restart: unless-stopped
    command:
    - memcached
    - -m
    - '1024'
  api:
    image: agroportal/ontologies_api:master
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      virtuoso:
        condition: service_started
      mgrep:
        condition: service_started
      solr:
        condition: service_healthy
    ports:
    - ${API_BIND:-0.0.0.0}:${API_PORT:-9393}:9393
    environment:
      RACK_ENV: compose
      RAILS_ENV: compose
      BUNDLE_PATH: /data/bundle/api
      OP_APIKEY: ${ONTOPORTAL_API_KEY:-change-me}
      API_KEY: ${ONTOPORTAL_API_KEY:-change-me}
      STORE_KB: ontoportal_kb
      GOO_BACKEND_NAME: virtuoso
      GOO_HOST: virtuoso
      GOO_PORT: '8890'
      GOO_PATH_DATA: /sparql/
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_UPDATE: /sparql/
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PERSISTENT_HOST: redis
      REDIS_GOO_CACHE_HOST: redis
      REDIS_HTTP_CACHE_HOST: redis
      SOLR_TERM_SEARCH_URL: http://solr:8983/solr/term_search_core1
      SOLR_PROP_SEARCH_URL: http://solr:8983/solr/prop_search_core1
      MGREP_HOST: mgrep
      MGREP_PORT: '55556'
      MGREP_DICT_PATH: /data/mgrep/dictionary.txt
      MGREP_DICTIONARY_FILE: /data/mgrep/dictionary.txt
      REPOSITORY_FOLDER: /data/repository
      REPORT_PATH: /data/reports/ontologies_report.json
      REST_URL_PREFIX: http://localhost:9393
      PUBLIC_API_URL: http://localhost:9393
      ENABLE_SLICES: 'false'
    volumes:
    - ${DATA_DIR:-./data}:/data
    working_dir: /srv/ontoportal/ontologies_api
    command:
    - bash
    - -lc
    - "mkdir -p /data/repository /data/reports /data/mgrep /data/api/log /data/api/tmp/pids\
      \ /data/bundle/api /srv/ontoportal/data\nrm -rf log tmp || true\nln -snf /data/api/log\
      \ log\nln -snf /data/api/tmp tmp\nln -snf /data/repository /srv/ontoportal/data/repository\n\
      ln -snf /data/reports /srv/ontoportal/data/reports\nln -snf /data/mgrep /srv/ontoportal/data/mgrep\n\
      mkdir -p config/environments\ncat > config/environments/compose.rb <<RUBY\n\
      require \"active_support/all\"\nrequire \"active_support/isolated_execution_state\"\
      \nrequire \"sparql/client\"\n\nmodule SparqlClientUpdatePatch\n  def update(query,\
      \ **options)\n    @op = :update\n\n    if @cache.redis_cache\n      q_opts =\
      \ query.respond_to?(:options) ? (query.options || {}) : options\n      bypass\
      \ = q_opts[:bypass_cache]\n      graph = q_opts[:graph] || q_opts[:graphs]\n\
      \      if !bypass && graph\n        @cache.invalidate(graph)\n      end\n  \
      \  end\n\n    @alt_endpoint = options[:endpoint]\n    @logger.log(query, user:\
      \ options[:user], cached: false) do\n      case @url\n      when RDF::Queryable\n\
      \        require \"sparql\" unless defined?(::SPARQL::Grammar)\n        SPARQL.execute(query,\
      \ @url, update: true, optimize: true, **options)\n      else\n        response(query,\
      \ **options)\n      end\n    end\n    self\n  end\nend\nSPARQL::Client.prepend(SparqlClientUpdatePatch)\
      \ unless SPARQL::Client.ancestors.include?(SparqlClientUpdatePatch)\n\nGOO_BACKEND_NAME\
      \ = ENV.fetch(\"GOO_BACKEND_NAME\", \"virtuoso\")\nGOO_HOST = ENV.fetch(\"GOO_HOST\"\
      , \"localhost\")\nGOO_PATH_DATA = ENV.fetch(\"GOO_PATH_DATA\", \"/sparql/\"\
      )\nGOO_PATH_QUERY = ENV.fetch(\"GOO_PATH_QUERY\", \"/sparql/\")\nGOO_PATH_UPDATE\
      \ = ENV.fetch(\"GOO_PATH_UPDATE\", \"/sparql/\")\nGOO_PORT = ENV.fetch(\"GOO_PORT\"\
      , 8890)\nMGREP_HOST = ENV.fetch(\"MGREP_HOST\", \"localhost\")\nMGREP_PORT =\
      \ ENV.fetch(\"MGREP_PORT\", 55556)\nMGREP_DICT_PATH = ENV.fetch(\"MGREP_DICT_PATH\"\
      , \"/data/mgrep/dictionary.txt\")\nREDIS_GOO_CACHE_HOST = ENV.fetch(\"REDIS_GOO_CACHE_HOST\"\
      , \"localhost\")\nREDIS_HTTP_CACHE_HOST = ENV.fetch(\"REDIS_HTTP_CACHE_HOST\"\
      , \"localhost\")\nREDIS_PERSISTENT_HOST = ENV.fetch(\"REDIS_PERSISTENT_HOST\"\
      , \"localhost\")\nREDIS_PORT = ENV.fetch(\"REDIS_PORT\", 6379)\nREPORT_PATH\
      \ = ENV.fetch(\"REPORT_PATH\", \"/data/reports/ontologies_report.json\")\nREPOSITORY_FOLDER\
      \ = ENV.fetch(\"REPOSITORY_FOLDER\", \"/data/repository\")\nREST_URL_PREFIX\
      \ = ENV.fetch(\"REST_URL_PREFIX\", \"http://localhost:9393\")\nSOLR_PROP_SEARCH_URL\
      \ = ENV.fetch(\"SOLR_PROP_SEARCH_URL\", \"http://localhost:8983/solr/prop_search_core1\"\
      )\nSOLR_TERM_SEARCH_URL = ENV.fetch(\"SOLR_TERM_SEARCH_URL\", \"http://localhost:8983/solr/term_search_core1\"\
      )\n\nrequire \"net/http\"\nrequire \"json\"\nrequire \"uri\"\n\nmodule SOLR\n\
      \  module Administration\n    def solr_alive?\n      uri = URI(\"#{@solr_url}/admin/info/system?wt=json\"\
      )\n      req = Net::HTTP::Get.new(uri)\n      res = Net::HTTP.start(uri.hostname,\
      \ uri.port, open_timeout: 5, read_timeout: 10, use_ssl: uri.scheme == \"https\"\
      ) { |http| http.request(req) }\n      res.is_a?(Net::HTTPSuccess) && (JSON.parse(res.body).dig(\"\
      responseHeader\", \"status\") == 0 rescue false)\n    rescue StandardError\n\
      \      false\n    end\n\n    def fetch_all_collections\n      uri = URI(\"#{@solr_url}/admin/cores?action=STATUS&wt=json\"\
      )\n      req = Net::HTTP::Get.new(uri)\n      res = Net::HTTP.start(uri.hostname,\
      \ uri.port, open_timeout: 5, read_timeout: 10, use_ssl: uri.scheme == \"https\"\
      ) { |http| http.request(req) }\n      data = (JSON.parse(res.body) rescue {})\
      \ if res.is_a?(Net::HTTPSuccess)\n      if res.is_a?(Net::HTTPSuccess) && data.dig(\"\
      responseHeader\", \"status\") == 0\n        (data[\"status\"] || {}).keys\n\
      \      else\n        raise \"Failed to fetch Solr collections: #{res&.code}\
      \ #{res&.body}\"\n      end\n    end\n\n    def collection_exists?(collection_name\
      \ = @collection_name)\n      fetch_all_collections.include?(collection_name.to_s)\n\
      \    end\n\n    def create_collection(collection_name = @collection_name, _num_shards\
      \ = 1, _replication_factor = 1)\n      return if collection_exists?(collection_name)\n\
      \n      params = URI.encode_www_form(\n        action: \"CREATE\",\n       \
      \ name: collection_name.to_s,\n        instanceDir: collection_name.to_s,\n\
      \        configSet: \"_default\",\n        wt: \"json\"\n      )\n      uri\
      \ = URI(\"#{@solr_url}/admin/cores?#{params}\")\n      req = Net::HTTP::Post.new(uri)\n\
      \      res = Net::HTTP.start(uri.hostname, uri.port, open_timeout: 5, read_timeout:\
      \ 10, use_ssl: uri.scheme == \"https\") { |http| http.request(req) }\n     \
      \ data = (JSON.parse(res.body) rescue {}) if res.is_a?(Net::HTTPSuccess)\n \
      \     unless res.is_a?(Net::HTTPSuccess) && data.dig(\"responseHeader\", \"\
      status\") == 0\n        raise \"Failed to create Solr collection #{collection_name}:\
      \ #{res&.code} #{res&.body}\"\n      end\n    end\n\n    def delete_collection(collection_name\
      \ = @collection_name)\n      return unless collection_exists?(collection_name)\n\
      \n      params = URI.encode_www_form(\n        action: \"UNLOAD\",\n       \
      \ core: collection_name.to_s,\n        deleteIndex: \"true\",\n        deleteDataDir:\
      \ \"true\",\n        deleteInstanceDir: \"true\",\n        wt: \"json\"\n  \
      \    )\n      uri = URI(\"#{@solr_url}/admin/cores?#{params}\")\n      req =\
      \ Net::HTTP::Post.new(uri)\n      res = Net::HTTP.start(uri.hostname, uri.port,\
      \ open_timeout: 5, read_timeout: 10, use_ssl: uri.scheme == \"https\") { |http|\
      \ http.request(req) }\n      data = (JSON.parse(res.body) rescue {}) if res.is_a?(Net::HTTPSuccess)\n\
      \      unless res.is_a?(Net::HTTPSuccess) && data.dig(\"responseHeader\", \"\
      status\") == 0\n        raise \"Failed to delete Solr collection #{collection_name}:\
      \ #{res&.code} #{res&.body}\"\n      end\n    end\n  end\n\n  class SolrConnector\n\
      \    alias_method :orig_initialize, :initialize rescue nil\n    def initialize(solr_url,\
      \ collection_name, *args, **kwargs)\n      @solr_url = solr_url\n      @collection_name\
      \ = collection_name\n      @solr = RSolr.connect(url: collection_url)\n\n  \
      \    wait_time = 0\n      max_wait_time = Integer(ENV.fetch(\"SOLR_WAIT_TIMEOUT\"\
      , \"120\"))\n      until solr_alive? || wait_time >= max_wait_time\n       \
      \ sleep 1\n        wait_time += 1\n      end\n      raise \"Solr instance not\
      \ reachable within #{max_wait_time} seconds\" unless solr_alive?\n\n      @custom_schema\
      \ = false\n    end\n  end\nend\n\nif defined?(LinkedData)\n  LinkedData.config\
      \ do |config|\n    config.goo_backend_name = GOO_BACKEND_NAME.to_s\n    config.goo_host\
      \ = GOO_HOST.to_s\n    config.goo_port = GOO_PORT.to_i\n    config.goo_path_query\
      \ = GOO_PATH_QUERY.to_s\n    config.goo_path_data = GOO_PATH_DATA.to_s\n   \
      \ config.goo_path_update = GOO_PATH_UPDATE.to_s\n    config.goo_redis_host =\
      \ REDIS_GOO_CACHE_HOST.to_s\n    config.goo_redis_port = REDIS_PORT.to_i\n \
      \   config.http_redis_host = REDIS_HTTP_CACHE_HOST.to_s\n    config.http_redis_port\
      \ = REDIS_PORT.to_i\n    config.ontology_analytics_redis_host = REDIS_PERSISTENT_HOST.to_s\n\
      \    config.ontology_analytics_redis_port = REDIS_PORT.to_i\n    config.repository_folder\
      \ = REPOSITORY_FOLDER.to_s\n    config.search_server_url = SOLR_TERM_SEARCH_URL.to_s.sub(%r{/term_search_core1/?\\\
      z}, \"\")\n    config.property_search_server_url = SOLR_PROP_SEARCH_URL.to_s.sub(%r{/prop_search_core1/?\\\
      z}, \"\")\n    config.replace_url_prefix = true\n    config.rest_url_prefix\
      \ = REST_URL_PREFIX.to_s\n    config.enable_notifications = false\n  end\nend\n\
      \nif defined?(Annotator)\n  Annotator.config do |config|\n    config.annotator_redis_host\
      \ = REDIS_PERSISTENT_HOST.to_s\n    config.annotator_redis_port = REDIS_PORT.to_i\n\
      \    config.mgrep_host = MGREP_HOST.to_s\n    config.mgrep_port = MGREP_PORT.to_i\n\
      \    config.mgrep_dictionary_file = MGREP_DICT_PATH.to_s\n  end\nend\n\nif defined?(NcboCron)\n\
      \  NcboCron.config do |config|\n    config.redis_host = REDIS_PERSISTENT_HOST.to_s\n\
      \    config.redis_port = REDIS_PORT.to_i\n    config.ontology_report_path =\
      \ REPORT_PATH\n    config.daemonize = false\n    config.search_index_all_url\
      \ = ENV.fetch(\"SEARCH_INDEX_ALL_URL\", SOLR_TERM_SEARCH_URL)\n    config.property_search_index_all_url\
      \ = ENV.fetch(\"PROPERTY_SEARCH_INDEX_ALL_URL\", SOLR_PROP_SEARCH_URL)\n  end\n\
      end\n\nif defined?(LinkedData::OntologiesAPI)\n  LinkedData::OntologiesAPI.config\
      \ do |config|\n    config.http_redis_host = REDIS_HTTP_CACHE_HOST.to_s\n   \
      \ config.http_redis_port = REDIS_PORT.to_i\n    config.ontology_report_path\
      \ = REPORT_PATH\n    config.enable_req_timeout = false\n    config.enable_throttling\
      \ = false\n  end\nend\n\nGoo.use_cache = true if defined?(Goo)\nRUBY\ngem install\
      \ bundler -v 2.3.27 >/dev/null 2>&1 || true\nbundle _2.3.27_ check || bundle\
      \ _2.3.27_ install\nrm -f tmp/pids/*.pid || true\nexec bundle _2.3.27_ exec\
      \ rackup -o 0.0.0.0 --port 9393"
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:9393/ >/dev/null || exit 1
      interval: 20s
      timeout: 5s
      retries: 20
  cron:
    image: agroportal/ncbo_cron:development
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      virtuoso:
        condition: service_started
      mgrep:
        condition: service_started
      solr:
        condition: service_healthy
    environment:
      RACK_ENV: compose
      RAILS_ENV: compose
      BUNDLE_PATH: /data/bundle/cron
      OP_APIKEY: ${ONTOPORTAL_API_KEY:-change-me}
      API_KEY: ${ONTOPORTAL_API_KEY:-change-me}
      STORE_KB: ontoportal_kb
      GOO_BACKEND_NAME: virtuoso
      GOO_HOST: virtuoso
      GOO_PORT: '8890'
      GOO_PATH_DATA: /sparql/
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_UPDATE: /sparql/
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PERSISTENT_HOST: redis
      REDIS_GOO_CACHE_HOST: redis
      REDIS_HTTP_CACHE_HOST: redis
      SOLR_TERM_SEARCH_URL: http://solr:8983/solr/term_search_core1
      SOLR_PROP_SEARCH_URL: http://solr:8983/solr/prop_search_core1
      MGREP_HOST: mgrep
      MGREP_PORT: '55556'
      MGREP_DICT_PATH: /data/mgrep/dictionary.txt
      MGREP_DICTIONARY_FILE: /data/mgrep/dictionary.txt
      REPOSITORY_FOLDER: /data/repository
      REPORT_PATH: /data/reports/ontologies_report.json
      REST_URL_PREFIX: http://localhost:9393
      PUBLIC_API_URL: http://localhost:9393
      ENABLE_SLICES: 'false'
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      STARTER_ONTOLOGY: STY
      OP_API_URL: https://data.bioontology.org
    volumes:
    - ${DATA_DIR:-./data}:/data
    command:
    - bash
    - -lc
    - "if [ -d /srv/ontoportal/ncbo_cron ]; then cd /srv/ontoportal/ncbo_cron; elif\
      \ [ -d /srv/ontoportal/ontologies_api ]; then cd /srv/ontoportal/ontologies_api;\
      \ elif [ -d /srv/ontoportal/ncbo_cron ]; then cd /srv/ontoportal/ncbo_cron;\
      \ fi\ngit config --global --add safe.directory '*' || true\nmkdir -p /data/repository\
      \ /data/reports /data/mgrep /data/history /data/cron/logs /data/cron/tmp/pids\
      \ /data/bundle/cron /srv/ontoportal/data\nrm -rf log logs tmp /usr/local/hist\
      \ || true\nln -snf /data/cron/logs log\nln -snf /data/cron/logs logs\nln -snf\
      \ /data/cron/tmp tmp\nln -snf /data/history /usr/local/hist\nln -snf /data/repository\
      \ /srv/ontoportal/data/repository\nln -snf /data/reports /srv/ontoportal/data/reports\n\
      ln -snf /data/mgrep /srv/ontoportal/data/mgrep\nmkdir -p config/environments\n\
      cat > config/environments/compose.rb <<RUBY\nrequire \"active_support/all\"\n\
      require \"active_support/isolated_execution_state\"\nrequire \"sparql/client\"\
      \n\nmodule SparqlClientUpdatePatch\n  def update(query, **options)\n    @op\
      \ = :update\n\n    if @cache.redis_cache\n      q_opts = query.respond_to?(:options)\
      \ ? (query.options || {}) : options\n      bypass = q_opts[:bypass_cache]\n\
      \      graph = q_opts[:graph] || q_opts[:graphs]\n      if !bypass && graph\n\
      \        @cache.invalidate(graph)\n      end\n    end\n\n    @alt_endpoint =\
      \ options[:endpoint]\n    @logger.log(query, user: options[:user], cached: false)\
      \ do\n      case @url\n      when RDF::Queryable\n        require \"sparql\"\
      \ unless defined?(::SPARQL::Grammar)\n        SPARQL.execute(query, @url, update:\
      \ true, optimize: true, **options)\n      else\n        response(query, **options)\n\
      \      end\n    end\n    self\n  end\nend\nSPARQL::Client.prepend(SparqlClientUpdatePatch)\
      \ unless SPARQL::Client.ancestors.include?(SparqlClientUpdatePatch)\n\nGOO_BACKEND_NAME\
      \ = ENV.fetch(\"GOO_BACKEND_NAME\", \"virtuoso\")\nGOO_HOST = ENV.fetch(\"GOO_HOST\"\
      , \"localhost\")\nGOO_PATH_DATA = ENV.fetch(\"GOO_PATH_DATA\", \"/sparql/\"\
      )\nGOO_PATH_QUERY = ENV.fetch(\"GOO_PATH_QUERY\", \"/sparql/\")\nGOO_PATH_UPDATE\
