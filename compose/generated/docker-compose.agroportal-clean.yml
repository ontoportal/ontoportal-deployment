  ui:
    image: agroportal/ontoportal_web_ui:development
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mysql:
        condition: service_healthy
      memcached:
        condition: service_started
    ports:
    - ${UI_BIND:-0.0.0.0}:${UI_PORT:-3000}:3000
    environment:
      RAILS_ENV: production
      BUNDLE_PATH: /data/bundle/ui
      SITE_NAME: AgroPortal
      ORG_NAME: AgroPortal
      ORG_URL: https://agroportal.lirmm.fr
      SUPPORT_EMAIL: support@example.org
      UI_THEME: agroportal
      UI_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:9393
      FORCE_SSL: 'false'
      MEMCACHE_SERVERS: memcached:11211
      MYSQL_HOST: mysql
      MYSQL_DATABASE: bioportal_ui_production
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      OP_API_KEY: ${ONTOPORTAL_API_KEY:-change-me}
      SESSION_COOKIE_KEY: _session_id
      RAILS_FORCE_SSL: 'false'
      DB_HOST: mysql
      BIOPORTAL_WEB_UI_DATABASE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      CACHE_HOST: memcached
      API_KEY: ${ONTOPORTAL_API_KEY:-change-me}
      OP_APIKEY: ${ONTOPORTAL_API_KEY:-change-me}
      API_URL: http://api:9393
      ANNOTATOR_URL: http://api:9393/annotator
      SITE: AgroPortal
      ORG: AgroPortal
      RELEASE_VERSION: OntoPortal deployment
      FAIRNESS_DISABLED: 'true'
      NCBO_ANNOTATORPLUS_ENABLED: 'false'
      BIOMIXER_URL: ''
      BIOMIXER_PUBLIC_APIKEY: ''
      USE_LEGACY_BIOMIXER: 'true'
      ONTOPANEL_VISUALIZER_URL: ''
      SPARQL_URL: http://virtuoso:8890/sparql/
      PUBLIC_SPARQL_URL: ''
      PUBLIC_FAIRNESS_URL: ''
      SESSION_COOKIE_DOMAIN: ''
      SESSION_COOKIE_SAME_SITE: ''
      SESSION_COOKIE_SECURE: ''
    volumes:
    - ${DATA_DIR:-./data}:/data
    working_dir: /app
    command:
    - bash
    - -lc
    - 'mkdir -p /data/ui/log /data/ui/tmp/pids /data/bundle/ui

      rm -rf log tmp || true

      ln -snf /data/ui/log log

      ln -snf /data/ui/tmp tmp

      gem install bundler -v 2.3.27 >/dev/null 2>&1 || true

      bundle _2.3.27_ check || bundle _2.3.27_ install

      CLIENT_GEM_PATH="$$(bundle _2.3.27_ show ontologies_api_client 2>/dev/null ||
      true)"; if [ -n "$$CLIENT_GEM_PATH" ] && [ -f "$$CLIENT_GEM_PATH/lib/ontologies_api_client/models/class.rb"
      ]; then sed -i ''s/hasChildren,childre,/hasChildren,children,/g'' "$$CLIENT_GEM_PATH/lib/ontologies_api_client/models/class.rb"
      || true; fi

      for i in $$(seq 1 30); do if bundle _2.3.27_ exec rails db:prepare; then break;
      fi; if [ "$$i" = "30" ]; then echo "ERROR: rails db:prepare failed after $${i}
      attempts" >&2; exit 1; fi; echo "Waiting for UI database to become ready ($${i}/30)"
      >&2; sleep 5; done

      rm -f tmp/pids/*.pid || true

      exec bundle _2.3.27_ exec puma -C /dev/null -b tcp://0.0.0.0:3000 -e production'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:3000/ >/dev/null || exit 1
      interval: 20s
      timeout: 5s
      retries: 60
