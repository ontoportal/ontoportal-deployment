networkPolicy:
  enabled: false
  allowSameNamespace: true
  allowIngressController: false
  ingressNamespaceSelector: {}
  ingressPodSelector: {}
  allowAllEgress: true
  extraIngress: []
  extraEgress: []

monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

patches:
  # Clean OntoPortal profile leaves this disabled. MatPortal can enable it explicitly.
  matportalApiParentNormalization:
    enabled: false
  runtimeHotfixes:
    enabled: false
