{{- if .Values.mgrep.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ontoportal.fullname" . }}-mgrep
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: mgrep
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  ports:
    - name: mgrep
      port: {{ .Values.mgrep.service.port }}
      targetPort: mgrep
  selector:
    app.kubernetes.io/component: mgrep
    {{- include "ontoportal.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-mgrep
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: mgrep
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mgrep
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mgrep
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.mgrep .) | nindent 6 }}
      containers:
        - name: mgrep
          image: {{ include "ontoportal.image" .Values.images.mgrep | quote }}
          imagePullPolicy: {{ .Values.images.mgrep.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          ports:
            - name: mgrep
              containerPort: {{ .Values.mgrep.containerPort }}
          command:
            - /bin/sh
            - -lc
            - |
              {{- if .Values.mgrep.command }}
              {{ .Values.mgrep.command }}
              {{- else }}
              set -eu
              mgrep_bin="$(command -v mgrep || true)"
              if [ -z "${mgrep_bin}" ]; then
                echo "ERROR: mgrep executable is not on PATH" >&2
                exit 1
              fi
              dictionary_path={{ .Values.mgrep.dictionaryPath | quote }}
              mkdir -p "$(dirname "${dictionary_path}")"
              is_dummy_dictionary() {
                [ "$(wc -c < "$1")" -eq 8 ] && printf '0\tDUMMY\n' | cmp -s - "$1"
              }
              copy_baked_dictionary() {
                for source in /srv/mgrep/dictionary.txt /srv/mgrep/dictionary/dictionary.txt; do
                  if [ -s "${source}" ] && ! is_dummy_dictionary "${source}"; then
                    cp "${source}" "${dictionary_path}"
                    return 0
                  fi
                done
                echo "ERROR: no usable mgrep dictionary found for ${dictionary_path}" >&2
                exit 1
              }
              if [ ! -s "${dictionary_path}" ] || is_dummy_dictionary "${dictionary_path}"; then
                copy_baked_dictionary
              fi
              for required in /srv/mgrep/word_divider.txt /srv/mgrep/CaseFolding.txt; do
                if [ ! -s "${required}" ]; then
                  echo "ERROR: required mgrep file is missing: ${required}" >&2
                  exit 1
                fi
              done
              stop_mgrep() {
                trap - TERM INT
                pkill -TERM -x mgrep 2>/dev/null || true
                exit 143
              }
              trap stop_mgrep TERM INT
              mgrep --port {{ .Values.mgrep.containerPort }} -f "${dictionary_path}" -w /srv/mgrep/word_divider.txt -c /srv/mgrep/CaseFolding.txt &
              launcher_pid=$!
              attempts=0
              while ! pgrep -x mgrep >/dev/null 2>&1; do
                attempts=$((attempts + 1))
                if [ "${attempts}" -ge 50 ]; then
                  wait "${launcher_pid}" 2>/dev/null || true
                  echo "ERROR: mgrep daemon did not remain running" >&2
                  exit 1
                fi
                sleep 0.2
              done
              wait "${launcher_pid}" 2>/dev/null || true
              while pgrep -x mgrep >/dev/null 2>&1; do
                sleep 1
              done
              echo "ERROR: mgrep daemon exited" >&2
              exit 1
              {{- end }}
          {{- with .Values.mgrep.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            tcpSocket:
              port: mgrep
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mgrep
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mgrep
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          {{- include "ontoportal.volumeDataSource" (list . .Values.persistence.shared.existingClaim (printf "%s-shared-data" (include "ontoportal.fullname" .))) | nindent 10 }}
{{- end }}
