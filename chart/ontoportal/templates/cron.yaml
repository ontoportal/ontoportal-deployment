{{- if .Values.cron.enabled }}
{{- $secretName := include "ontoportal.secretName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ontoportal.fullname" . }}-cron
  namespace: {{ include "ontoportal.namespace" . }}
  labels:
    app.kubernetes.io/component: cron
    {{- include "ontoportal.labels" . | nindent 4 }}
  {{- include "ontoportal.annotations" . | nindent 2 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: cron
      {{- include "ontoportal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cron
        {{- include "ontoportal.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ontoportal.fullname" . }}
      {{- include "ontoportal.podSecurityContext" . | nindent 6 }}
      {{- include "ontoportal.componentScheduling" (list .Values.cron .) | nindent 6 }}
      containers:
        - name: cron
          image: {{ include "ontoportal.image" .Values.images.cron | quote }}
          imagePullPolicy: {{ .Values.images.cron.pullPolicy }}
          {{- include "ontoportal.containerSecurityContext" . | nindent 10 }}
          env:
            - name: BUNDLE_PATH
              value: /data/bundle/cron
            - name: BUNDLE_APP_CONFIG
              value: {{ printf "%s/.bundle" .Values.cron.appDir | quote }}
            - name: OP_APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: apiKey
            - name: STORE_KB
              value: {{ .Values.store.kbName | quote }}
            - name: GOO_BACKEND_NAME
              value: {{ include "ontoportal.storeBackendName" . | trim | quote }}
            - name: GOO_HOST
              value: {{ include "ontoportal.storeHost" . | trim | quote }}
            - name: GOO_PORT
              value: {{ include "ontoportal.storePort" . | trim | quote }}
            - name: GOO_PATH_DATA
              value: {{ .Values.store.pathData | quote }}
            - name: GOO_PATH_QUERY
              value: {{ .Values.store.pathQuery | quote }}
            - name: GOO_PATH_UPDATE
              value: {{ .Values.store.pathUpdate | quote }}
            - name: REDIS_HOST
              value: {{ include "ontoportal.redisHostPersistent" . | trim | quote }}
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_GOO_CACHE_HOST
              value: {{ include "ontoportal.redisHostGoo" . | trim | quote }}
            - name: REDIS_HTTP_CACHE_HOST
              value: {{ include "ontoportal.redisHostHttp" . | trim | quote }}
            - name: REDIS_PERSISTENT_HOST
              value: {{ include "ontoportal.redisHostPersistent" . | trim | quote }}
            - name: SOLR_TERM_SEARCH_URL
              value: {{ include "ontoportal.solrTermUrl" . | trim | quote }}
            - name: SOLR_PROP_SEARCH_URL
              value: {{ include "ontoportal.solrPropUrl" . | trim | quote }}
            - name: SEARCH_INDEX_ALL_URL
              value: {{ include "ontoportal.solrTermUrl" . | trim | quote }}
            - name: PROPERTY_SEARCH_INDEX_ALL_URL
              value: {{ include "ontoportal.solrPropUrl" . | trim | quote }}
            - name: MGREP_HOST
              value: {{ printf "%s-mgrep" (include "ontoportal.fullname" .) | quote }}
            - name: MGREP_PORT
              value: {{ .Values.mgrep.service.port | quote }}
            - name: MGREP_DICT_PATH
              value: {{ .Values.mgrep.dictionaryPath | quote }}
            - name: MGREP_DICTIONARY_FILE
              value: {{ .Values.mgrep.dictionaryPath | quote }}
            - name: REPOSITORY_FOLDER
              value: /data/repository
            - name: REPORT_PATH
              value: /data/reports/ontologies_report.json
            - name: REST_URL_PREFIX
              value: {{ .Values.api.restUrlPrefix | default .Values.api.publicUrl | quote }}
            - name: ADMIN_USERNAME
              value: {{ .Values.secrets.admin.username | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.secrets.admin.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: adminPassword
            - name: STARTER_ONTOLOGY
              value: {{ .Values.cron.starterOntology.acronym | quote }}
            - name: OP_API_URL
              value: {{ .Values.cron.starterOntology.fromApiUrl | quote }}
            {{- if .Values.cron.starterOntology.fromApiKeySecret.name }}
            - name: SOURCE_OP_APIKEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cron.starterOntology.fromApiKeySecret.name | quote }}
                  key: {{ .Values.cron.starterOntology.fromApiKeySecret.key | quote }}
            {{- end }}
            {{- range $k, $v := .Values.cron.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              if [ -d {{ .Values.cron.appDir | quote }} ]; then
                cd {{ .Values.cron.appDir | quote }}
              elif [ -d /srv/ontoportal/ontologies_api ]; then
                cd /srv/ontoportal/ontologies_api
              elif [ -d /srv/ontoportal/ncbo_cron ]; then
                cd /srv/ontoportal/ncbo_cron
              fi
              git config --global --add safe.directory '*' || true
              mkdir -p /data/repository /data/reports /data/mgrep /data/history /data/cron/logs /data/cron/tmp/pids /data/bundle/cron /srv/ontoportal/data
              rm -rf log logs tmp /usr/local/hist || true
              ln -snf /data/cron/logs log
              ln -snf /data/cron/logs logs
              ln -snf /data/cron/tmp tmp
              ln -snf /data/history /usr/local/hist
              ln -snf /data/repository /srv/ontoportal/data/repository
              ln -snf /data/reports /srv/ontoportal/data/reports
              ln -snf /data/mgrep /srv/ontoportal/data/mgrep
              {{- include "ontoportal.runtimeConfigScript" . | nindent 14 }}
              cp "config/environments/${RACK_ENV:-production}.rb" config/environments/production.rb 2>/dev/null || true
              cp "config/environments/${RACK_ENV:-production}.rb" config/environments/development.rb 2>/dev/null || true
              cp "config/environments/${RACK_ENV:-production}.rb" config/config.rb 2>/dev/null || true
              {{- with .Values.cron.extraStartupScript }}
{{ . | nindent 14 }}
              {{- end }}
              bundle check || bundle install
              NCBO_CRON_DIR=$(bundle show ncbo_cron 2>/dev/null || true)
              if [ -n "${NCBO_CRON_DIR}" ]; then
                mkdir -p "${NCBO_CRON_DIR}/config"
                cp "config/environments/${RACK_ENV:-production}.rb" "${NCBO_CRON_DIR}/config/config.rb"
              fi
              ANNO_DIR=$(bundle show ncbo_annotator 2>/dev/null || true)
              if [ -n "${ANNO_DIR}" ] && [ -d "${ANNO_DIR}/lib/Lemmatizer" ]; then
                ln -snf "${ANNO_DIR}/lib/Lemmatizer" lib/Lemmatizer || true
              fi
              for url in "${SOLR_TERM_SEARCH_URL}" "${SOLR_PROP_SEARCH_URL}"; do
                solr_base="${url%/term_search_core1}"
                solr_base="${solr_base%/prop_search_core1}"
                echo "Waiting for Solr at ${solr_base} to be ready..."
                ready=false
                for i in $(seq 1 60); do
                  if curl -fsS --connect-timeout 5 --max-time 10 "${solr_base}/admin/info/system?wt=json" >/dev/null 2>&1; then
                    ready=true
                    break
                  fi
                  sleep 2
                done
                if [ "${ready}" != "true" ]; then
                  echo "WARN: Solr at ${solr_base} did not respond ready within 120s; continuing to cron startup" >&2
                fi
              done
              bundle exec ruby <<'RUBY' || echo "WARN: could not patch Virtuoso Goo handling" >&2
              def patch_gem(gem_name, relative_path, replacements)
                path = File.join(Gem::Specification.find_by_name(gem_name).full_gem_path, relative_path)
                source = File.read(path)
                patched = replacements.reduce(source) { |text, (old, new_text)| text.gsub(old, new_text) }
                File.write(path, patched) if patched != source
              end
              def append_gem_patch(gem_name, relative_path, marker, patch)
                path = File.join(Gem::Specification.find_by_name(gem_name).full_gem_path, relative_path)
                source = File.read(path)
                File.write(path, source + "\n" + patch) unless source.include?(marker)
              end
              patch_gem("ontologies_linked_data", "lib/ontologies_linked_data/services/submission_process/operations/submission_rdf_generator.rb", {
                " if e.response&.body" => " if e.respond_to?(:response) && e.response&.body"
              })
              patch_gem("ncbo_cron", "bin/ncbo_cron", {
                "require 'sys/proctable'" => "begin; require 'sys/proctable'; rescue LoadError; end"
              })
              patch_gem("goo", "lib/goo/sparql/client.rb", {
                "DROP GRAPH <" => "DROP SILENT GRAPH <",
                "chunk_lines = 500_000 # number of line" => "chunk_lines = Integer(ENV.fetch(\"GOO_APPEND_CHUNK_LINES\", \"2000\")) # patched for Virtuoso update payload size"
              })
              append_gem_patch("goo", "lib/goo/sparql/client.rb", "GooVirtuosoAppendPatch", <<'RUBY_PATCH')
              # ontoportal-deployment: Virtuoso does not accept Goo's Graph Store append POST on /sparql/.
              module GooVirtuosoAppendPatch
                private

                def execute_append_request(graph, data_file, mime_type_in)
                  return super unless Goo.sparql_backend_name.to_s == "virtuoso"

                  graph_iri = graph.is_a?(Array) ? graph.first.to_s : graph.to_s
                  Goo.sparql_update_client.update("INSERT DATA { GRAPH <#{graph_iri}> {\n#{data_file}\n} }", graph: graph)
                end
              end
              Goo::SPARQL::Client.prepend(GooVirtuosoAppendPatch) unless Goo::SPARQL::Client.ancestors.include?(GooVirtuosoAppendPatch)
              RUBY_PATCH
              RUBY
              {{- if .Values.secrets.admin.enabled }}
              if [ ! -f /data/cron/.admin_seeded ]; then
                RAKE_OPTS=""
                if [ -n "${NCBO_CRON_DIR}" ] && [ -d "${NCBO_CRON_DIR}/rakelib" ]; then
                  RAKE_OPTS="--rakelibdir ${NCBO_CRON_DIR}/rakelib"
                fi
                if bundle exec rake ${RAKE_OPTS} "user:create[${ADMIN_USERNAME},${ADMIN_EMAIL},${ADMIN_PASSWORD}]"; then
                  bundle exec rake ${RAKE_OPTS} "user:adminify[${ADMIN_USERNAME}]" || true
                  touch /data/cron/.admin_seeded
                else
                  echo "WARN: admin user seed failed or already exists" >&2
                fi
              fi
              {{- end }}
              {{- if .Values.cron.starterOntology.enabled }}
              if [ ! -f /data/cron/.starter_ontology_imported ]; then
                NCBO_IMPORT="ncbo_ontology_import"
                NCBO_PULL="ncbo_ontology_pull"
                NCBO_PROCESS="ncbo_ontology_process"
                if [ -f bin/ncbo_ontology_import ]; then
                  NCBO_IMPORT="bin/ncbo_ontology_import"
                  NCBO_PULL="bin/ncbo_ontology_pull"
                  NCBO_PROCESS="bin/ncbo_ontology_process"
                fi
                if bundle exec ${NCBO_IMPORT} --from-apikey "${SOURCE_OP_APIKEY:-${OP_APIKEY:-}}" -o "${STARTER_ONTOLOGY}" --from "${OP_API_URL}" --admin-user "${ADMIN_USERNAME}" \
                  && bundle exec ${NCBO_PULL} -o "${STARTER_ONTOLOGY}" \
                  && bundle exec ${NCBO_PROCESS} -o "${STARTER_ONTOLOGY}"; then
                  touch /data/cron/.starter_ontology_imported
                else
                  echo "WARN: starter ontology import failed" >&2
                  {{- if .Values.cron.starterOntology.required }}
                  exit 1
                  {{- end }}
                fi
              fi
              {{- end }}
              CRON_CMD={{ .Values.cron.startCommand | quote }}
              if [ "${CRON_CMD}" = "bundle exec bin/ncbo_cron" ] && [ ! -f bin/ncbo_cron ]; then
                exec bundle exec ncbo_cron
              else
                exec {{ .Values.cron.startCommand }}
              fi
          {{- with .Values.cron.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          {{- include "ontoportal.volumeDataSource" (list . .Values.persistence.shared.existingClaim (printf "%s-shared-data" (include "ontoportal.fullname" .))) | nindent 10 }}
{{- end }}
